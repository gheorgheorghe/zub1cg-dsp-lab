<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZUBoard 1CG · Interactive Study Notes</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b0f17;
    color: #e6edf7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 56px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 25px; margin: 0 0 6px; }
  p.sub { color: #93a4be; margin: 0 0 18px; font-size: 14.5px; }

  /* Search & Sort Toolbar */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: #131a26;
    border: 1px solid #26334a;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .search-wrap {
    flex: 1 1 260px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    background: #0b0f17;
    color: #e6edf7;
    border: 1px solid #2e3f5c;
    border-radius: 10px;
    padding: 9px 12px 9px 34px;
    font-size: 14px;
    outline: none;
  }
  .search-wrap input:focus { border-color: #38bdf8; }
  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: #64748b;
    pointer-events: none;
  }
  .sort-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  button.sbtn {
    background: #192233;
    border: 1px solid #2a3a55;
    color: #cbd5e1;
    padding: 7px 11px;
    border-radius: 9px;
    font-size: 12.6px;
    font-weight: 700;
    cursor: pointer;
  }
  button.sbtn:hover { border-color: #38bdf8; color: #fff; }
  button.sbtn.active {
    background: rgba(56,189,248,0.16);
    border-color: #38bdf8;
    color: #bae6fd;
  }
  .count {
    font-size: 12px;
    color: #93a4be;
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    margin-left: auto;
  }

  /* Table-like single-column list header */
  .list-hdr {
    display: grid;
    grid-template-columns: 126px 1fr 142px 96px;
    gap: 14px;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    align-items: center;
  }
  .list-hdr span.sortable { cursor: pointer; user-select: none; }
  .list-hdr span.sortable:hover { color: #38bdf8; }

  .study-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.card {
    display: grid;
    grid-template-columns: 126px 1fr 142px 96px;
    gap: 14px;
    align-items: center;
    text-decoration: none;
    color: inherit;
    background: #131a26;
    border: 1px solid #26334a;
    border-radius: 13px;
    padding: 11px 14px;
    transition: border-color 0.15s ease, transform 0.12s ease;
  }
  a.card:hover { border-color: #38bdf8; transform: translateY(-1px); }
  a.card.featured-green { border-color: #34d399; background: linear-gradient(135deg,#0f241f 0%,#131a26 100%); }
  a.card.featured-blue  { border-color: #38bdf8; background: linear-gradient(135deg,#0d1e33 0%,#131a26 100%); }
  a.card.featured-purple{ border-color: #c084fc; background: linear-gradient(135deg,#1d1433 0%,#131a26 100%); }

  .thumb {
    width: 126px;
    height: 80px;
    border-radius: 9px;
    overflow: hidden;
    background: #090d14;
    border: 1px solid #2a3952;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { min-width: 0; }
  h2 { margin: 0 0 4px; font-size: 16px; color: #fff; line-height: 1.25; }
  .desc { margin: 0; color: #93a4be; font-size: 13.1px; line-height: 1.4; }

  .col-cat { display: flex; justify-content: flex-start; }
  .cat-pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
    background: rgba(56,189,248,0.14);
    color: #38bdf8;
    border: 1px solid rgba(56,189,248,0.34);
  }
  .cat-pill.green  { background: rgba(52,211,153,0.14); color: #34d399; border-color: rgba(52,211,153,0.36); }
  .cat-pill.gold   { background: rgba(251,191,36,0.14); color: #fbbf24; border-color: rgba(251,191,36,0.36); }
  .cat-pill.purple { background: rgba(192,132,252,0.14); color: #c084fc; border-color: rgba(192,132,252,0.36); }
  .cat-pill.red    { background: rgba(248,113,113,0.14); color: #f87171; border-color: rgba(248,113,113,0.36); }

  .col-date {
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 12.6px;
    color: #93a4be;
    text-align: right;
    white-space: nowrap;
  }

  .empty {
    text-align: center;
    padding: 36px 16px;
    color: #93a4be;
    background: #131a26;
    border: 1px dashed #26334a;
    border-radius: 14px;
    display: none;
  }

  @media (max-width: 740px) {
    .list-hdr { display: none; }
    a.card {
      grid-template-columns: 98px 1fr;
      grid-template-rows: auto auto;
      gap: 8px 12px;
      padding: 11px;
    }
    .thumb { width: 98px; height: 64px; grid-row: 1 / span 2; }
    .body { grid-column: 2; grid-row: 1; }
    .col-cat { grid-column: 2; grid-row: 2; }
    .col-date { grid-column: 2; grid-row: 2; justify-self: end; align-self: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ZUBoard 1CG Study Notes</h1>
  <p class="sub">Interactive offline engineering explainers, physics labs &amp; live silicon reports for Stage 1 CVG / DRG / HRG.</p>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" placeholder="Search studies (e.g., ADEV, cloverleaf, ringdown, Quartz, 100V, bug)..." oninput="renderList()" />
    </div>
    <div class="sort-group">
      <button class="sbtn active" id="sortCurated" onclick="setSort('curated')">Curated</button>
      <button class="sbtn" id="sortDateDesc" onclick="setSort('date_desc')">Date &darr;</button>
      <button class="sbtn" id="sortDateAsc" onclick="setSort('date_asc')">Date &uarr;</button>
      <button class="sbtn" id="sortCat" onclick="setSort('cat')">Category A&ndash;Z</button>
    </div>
    <div class="count" id="countBadge">15 / 15</div>
  </div>

  <div class="list-hdr">
    <span>Figure</span>
    <span>Study</span>
    <span class="sortable" onclick="setSort('cat')">Category &#x21C5;</span>
    <span class="sortable" style="text-align:right;" onclick="toggleDateSort()">Date &#x21C5;</span>
  </div>

  <div class="study-list" id="studyList"></div>
  <div class="empty" id="emptyMsg">No studies match your search. Try clearing the search box.</div>
</div>

    keywords: "ringdown q-fit q factor 100v 20v electrostatic tuning beating rician g-sensitivity hysteresis plotly"
  },

  {

    category: "MEMS Physics", catClass: "gold", date: "2026-11-24", featured: "",

  {
    order: 14, href: "bugs/bug02_ksz9131_rgmii_txc_dll.html", thumb: "thumbs/bug02_rgmii.png",
    title: "KSZ9131RNX PHY & RGMII TXC 2 ns DLL Bypass (Bug #02)",
    desc: "How JTAG forensics caught an unsupported PHY OUI (0x0022) in lwip220 and the asymmetric MMD2 0x4D TXC DLL bypass (0x16D1 → 0x06D1), with interactive RGMII eye.",

  {
    order: 15, href: "bugs/bug01_a53_r5f_ddr_collision.html", thumb: "thumbs/bug01_ddr.png",
    title: "A53 / R5F LPDDR4 Memory Collision & Fix (Bug #01)",
    desc: "Visual Before/After memory map, interactive JTAG boot-crash timeline, and the exact Vitis lscript.ld partition + lwIP IRQ fix.",

    keywords: "bug01 a53 r5f lpddr4 memory collision linker lscript vitis jtag postmortem"
  }
];

let sortMode = 'curated';

function setSort(mode) {
  sortMode = mode;
  ['sortCurated', 'sortDateDesc', 'sortDateAsc', 'sortCat'].forEach(id => document.getElementById(id).classList.remove('active'));
  const map = { curated: 'sortCurated', date_desc: 'sortDateDesc', date_asc: 'sortDateAsc', cat: 'sortCat' };
  document.getElementById(map[mode]).classList.add('active');
  renderList();
}

function toggleDateSort() {
  setSort(sortMode === 'date_desc' ? 'date_asc' : 'date_desc');
}

function renderList() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let items = STUDIES.filter(s => {
    if (!q) return true;
    const hay = (s.title + ' ' + s.desc + ' ' + s.category + ' ' + s.date + ' ' + s.keywords).toLowerCase();
    return q.split(/\s+/).every(tok => hay.includes(tok));
  });

  items = items.slice().sort((a, b) => {
    if (sortMode === 'date_desc') return b.date.localeCompare(a.date) || (a.order - b.order);
    if (sortMode === 'date_asc')  return a.date.localeCompare(b.date) || (a.order - b.order);
    if (sortMode === 'cat')       return a.category.localeCompare(b.category) || b.date.localeCompare(a.date) || (a.order - b.order);
    return a.order - b.order;
  });

  const listEl = document.getElementById('studyList');
  const emptyEl = document.getElementById('emptyMsg');
  document.getElementById('countBadge').textContent = `${items.length} / ${STUDIES.length}`;

  if (items.length === 0) {
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  listEl.innerHTML = items.map(s => `
    <a class="card ${s.featured}" href="${s.href}">
      <div class="thumb"><img src="${s.thumb}" alt="${s.title}" loading="lazy" /></div>
      <div class="body">
        <h2>${s.title}</h2>
        <p class="desc">${s.desc}</p>
      </div>
      <div class="col-cat"><span class="cat-pill ${s.catClass}">${s.category}</span></div>
      <div class="col-date">${s.date}</div>
    </a>
  `).join('');
}

renderList();
</script>
</body>
</html>
